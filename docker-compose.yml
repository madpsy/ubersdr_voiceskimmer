services:
  ubersdr_voiceskimmer:
    image: madpsy/ubersdr_voiceskimmer:latest
    container_name: voiceskimmer
    restart: unless-stopped
    cpu_shares: 512
    environment:
      # UberSDR connection
      UBERSDR_HOST: "ubersdr"
      UBERSDR_PORT: "8080"
      # UBERSDR_SSL: "1"
      # UBERSDR_PASS: ""
      #
      # Scanning sessions to run at once, each on its own frequency (default 1).
      # Every session holds a Whisper slot for as long as it runs, and the
      # server's whisper.max_users defaults to 2 — so setting this to 2 uses
      # every slot and leaves none for web UI users. Raise whisper.max_users
      # on the server before going above 1.
      # PARALLEL: "1"
      #
      # Restrict to one or more bands, comma-separated (default: all bands)
      # BAND: "20m,40m"
      #
      # Dwell tuning (seconds). A frequency is held for DWELL; anything
      # callsign-shaped that has not validated yet pushes that out by
      # DWELL_EXTENSION, and MAX_DWELL is the hard ceiling however much is
      # being heard. A validated callsign ends the dwell immediately.
      # Setting MAX_DWELL below DWELL truncates the base dwell, not just the
      # extensions — the scanner warns if you do.
      # DWELL: "30"
      # MAX_DWELL: "60"
      # DWELL_EXTENSION: "30"
      # REVISIT_COOLDOWN: "120"
      #
      # Ignore weak/uncertain voice activity
      # MIN_SNR: "8"
      # MIN_CONFIDENCE: "0.7"
      #
      # How a frequency is judged quiet. SNR is measured directly from the
      # audio frame headers, so it does not depend on Whisper transcribing
      # anything. Any single peak above SILENCE_MIN_SNR within
      # SILENCE_TIMEOUT keeps the dwell alive; otherwise the scanner moves on.
      #
      # This is power vs noise DENSITY, not per-channel SNR — subtract about
      # 34.8 dB for a 3 kHz SSB channel. Measured live: a quiet frequency
      # sits around 33-34 dB and peaks below 38, an active one peaks past 40.
      # SILENCE_MIN_SNR: "40"
      # SILENCE_TIMEOUT: "10"
      #
      # Fallback for servers that send no signal data (version 1, or radiod
      # had no channel status): count transcribed words instead. A poor
      # proxy — Whisper hallucinates stock phrases on dead air — so it is
      # only used when the direct measurement is unavailable.
      # SILENCE_MIN_WORDS: "3"
      #
      # Extraction and lookup
      # MIN_EXTRACT_CONFIDENCE: "0.4"     # raise for precision, lower for recall
      # MIN_CALLSIGN_LENGTH: "4"          # gates the QRZ lookup, not just spotting
      #
      # Set to 6 if this instance is NOT on a bypassed IP — the default lookup
      # limit is 10/minute and you will otherwise see 429s and unvalidated
      # candidates. Check with: scanner.py --check
      # LOOKUP_INTERVAL: "6"
      #
      # PROGRESS_INTERVAL: "60"
      #
      # Stick to one exact frequency instead of hopping (for testing)
      # LOCK_FREQ: "7200000"
      # LOCK_MODE: "lsb"
      #
      # Whisper recognition tuning
      # PROMPT: ""
      # ASR_LANGUAGE: "en"
      # STOCK_WHISPER: "1"   # required if the server lacks whisper.allow_client_params
      #
      # DX cluster spot submission — off by default. Spots are immediately
      # visible to every connected DX cluster client.
      # SPOT: "1"
      # SPOTTER_CALL: ""
      # SPOTTER_PASS: ""
      # SPOT_TAG: "[Voice]"
      # SPOT_COOLDOWN: "900"
      # Hz tolerance for treating two hearings as the same station. Applies
      # to both the corroboration count (SPOT_MIN_HITS) and the re-spot
      # cooldown. Too tight and one station splits into several, so the hit
      # tally never accumulates.
      # SPOT_FREQ_TOLERANCE: "500"
      # Minimum callsign length to be looked up at all. Anything shorter is
      # dropped before QRZ, so it is never confirmed, logged as valid, or
      # spotted. Applies however the callsign was recovered, including one
      # Whisper wrote out verbatim.
      # MIN_CALLSIGN_LENGTH: "4"
      #
      # Decodes of the same callsign on the same frequency required before a
      # spot goes out (default 2). Above 1 trades latency for confidence — a
      # wrong callsign assembled from one garbled pass is unlikely to be
      # assembled identically a second time on the same frequency.
      # SPOT_MIN_HITS: "2"
      #
      # Dashboard port (0 disables it)
      # WEB_PORT: "6098"
      #
      # JSONL detection log path inside the container (persisted via the
      # /data bind mount below)
      # OUTPUT: "/data/detections.jsonl"
      #
      # VERBOSE: "1"
    networks:
      - sdr-network
    volumes:
      - ./voiceskimmer_data:/data
    logging:
      driver: "fluentd"
      options:
        fluentd-address: "127.0.0.1:24224"
        fluentd-async: "true"
        tag: "voiceskimmer"

networks:
  sdr-network:
    external: true
    name: ubersdr_sdr-network
