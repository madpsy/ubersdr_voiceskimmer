services:
  ubersdr_voiceskimmer:
    image: madpsy/ubersdr_voiceskimmer:latest
    container_name: voiceskimmer
    restart: unless-stopped
    cpu_shares: 512
    environment:
      # UberSDR connection
      UBERSDR_HOST: "ubersdr"
      UBERSDR_PORT: "8080"
      # Set to 1 for https/wss to the instance
      # UBERSDR_SSL: "1"
      # UBERSDR_PASS: ""
      #
      # Scanning sessions to run at once, each on its own frequency (default 1).
      #
      # UberSDR 0.1.59+ lists "voiceskimmer" in whisper.trusted_containers by
      # default, so this container's sessions are exempt from whisper.max_users
      # — they neither consume a slot nor get refused when the slots are full.
      # Keep container_name above as "voiceskimmer" (or add whatever you rename
      # it to on the server) or the exemption does not apply.
      #
      # That is a limit on the UberSDR session count, not on the WhisperLive
      # server behind it: every parallel session is still a concurrent
      # transcription, so raise this only as far as that box can keep up.
      #
      # Against an older UberSDR, or one with whisper.trusted_containers: [],
      # every session holds a slot and max_users defaults to 2 — so 2 here uses
      # every slot and leaves none for web UI users.
      # PARALLEL: "1"
      #
      # Restrict to one or more bands, comma-separated (default: all bands)
      BAND: "15m,20m,40m,80m"
      #
      # Dwell tuning. All values below are SECONDS.
      #
      #   DWELL            how long a frequency is held to begin with
      #   DWELL_EXTENSION  added when something callsign-shaped is heard but
      #                    has not validated yet, in the hope a repeat lets it
      #   MAX_DWELL        hard ceiling however much is being heard, so a busy
      #                    net cannot hold the scanner indefinitely
      #   REVISIT_COOLDOWN how long a frequency is left alone after the
      #                    scanner moves off it, before it may be picked again
      #
      # A validated callsign ends the dwell immediately — confirming one is
      # the point of the visit. Dead air ends it after SILENCE_TIMEOUT below.
      # So MAX_DWELL is a worst case, not a typical one.
      #
      # Setting MAX_DWELL below DWELL truncates the base dwell, not just the
      # extensions — the scanner warns if you do.
      # DWELL: "30"
      # MAX_DWELL: "60"
      # DWELL_EXTENSION: "30"
      # REVISIT_COOLDOWN: "120"
      #
      # Revisits. These do NOTHING unless SPOT is enabled below and the DX
      # cluster login succeeded: the trigger is a spot this scanner actually
      # submitted, so with spotting off no frequency ever counts as a revisit
      # and every dwell runs at full length.
      #
      # A frequency this scanner has ALREADY submitted a DX spot
      # from is still worth another look — a net or a pile-up keeps producing
      # callsigns — but the likeliest outcome is hearing the station already
      # spotted, so it gets a shorter dwell.
      #
      #   REVISIT_DWELL_PERIOD   SECONDS. How recently a spot must have gone
      #                          out from a frequency for the next visit to
      #                          count as a revisit. 900 = 15 minutes.
      #   REVISIT_DWELL_PERCENT  A FRACTION, not seconds. How much of the
      #                          normal dwell a revisit gets. 0.50 = half, so
      #                          on the defaults 15s base, 30s ceiling, 5s
      #                          silence. 1.00 = no reduction. Must be above
      #                          0 and at most 1.
      #
      # The percentage scales EVERY timing above together — base dwell,
      # ceiling, silence timeout and extension. Scaling only one would let the
      # others undo it: a frequency still producing unvalidated candidates
      # would extend straight back up to the full ceiling.
      #
      # Not the same as REVISIT_COOLDOWN. That decides whether a frequency may
      # be visited AT ALL; this decides how long, once it is.
      # REVISIT_DWELL_PERIOD: "900"
      # REVISIT_DWELL_PERCENT: "0.50"
      #
      # Ignore weak/uncertain voice activity.
      #
      # MIN_SNR is a PER-CHANNEL SNR in dB, filtering the server's voice
      # activity feed. The server computes it as the detected region's average
      # power minus the median noise floor (voice_activity.go).
      #
      # In practice the feed only reports signals well clear of the noise, so
      # the values arriving are much higher than the 6-10 dB its detector
      # nominally looks for. Sampled live across 3 bands: 16 signals, 20.3 dB
      # lowest, 25.7 median, 32.2 highest — a threshold of 8 discarded nothing
      # at all. 20 trims the weakest without gutting the list; raise toward 25
      # to chase only the strong ones.
      #
      # NOTE this is NOT the same scale as SILENCE_MIN_SNR below, despite both
      # being "SNR in dB". That one is power vs noise DENSITY and runs about
      # 34.8 dB higher for the same signal. Do not copy 40 up here: it would
      # demand a 40 dB channel SNR and the scanner would find nothing to scan.
      # MIN_SNR: "20"
      # MIN_CONFIDENCE: "0.7"
      #
      # How a frequency is judged quiet. SNR is measured directly from the
      # audio frame headers, so it does not depend on Whisper transcribing
      # anything. Any single peak above SILENCE_MIN_SNR within
      # SILENCE_TIMEOUT keeps the dwell alive; otherwise the scanner moves on.
      #
      # This is power vs noise DENSITY, not per-channel SNR — subtract about
      # 34.8 dB (10*log10 of a 3 kHz SSB channel) to compare it with MIN_SNR
      # above, which IS per-channel. So this 40 is roughly 5 dB of channel
      # SNR, in the same ballpark as MIN_SNR's 8 — the numbers look wildly
      # different only because the two scales are.
      #
      # Measured live: a quiet frequency sits around 33-34 dB on this scale
      # and peaks below 38, an active one peaks past 40.
      # SILENCE_MIN_SNR: "40"
      # SILENCE_TIMEOUT: "10"
      #
      # Fallback for servers that send no signal data (version 1, or radiod
      # had no channel status): count transcribed words instead. A poor
      # proxy — Whisper hallucinates stock phrases on dead air — so it is
      # only used when the direct measurement is unavailable.
      # SILENCE_MIN_WORDS: "3"
      #
      # Extraction and lookup
      # MIN_EXTRACT_CONFIDENCE: "0.4"     # raise for precision, lower for recall
      MIN_CALLSIGN_LENGTH: "5"          # gates the QRZ lookup, not just spotting
      #
      # By default, callsign extraction also runs on Whisper's in-progress
      # (not yet completed) hypothesis for each segment, alongside the
      # completed segment as before. Interim text is sometimes cleaner than
      # the finalised re-decode a completed segment replaces it with —
      # observed live, a callsign legible while the line was still updating
      # came out scrambled once Whisper committed to a final version.
      # Validation/spotting still go through the normal QRZ cache and
      # per-callsign dedup either way, so this does not multiply lookups or
      # announcements.
      #
      # Set to 0 to revert to the previous behaviour: only completed segments
      # are extracted from.
      # PARTIAL_EXTRACTION: "0"
      #
      # Set to 6 if this instance is NOT on a bypassed IP — the default lookup
      # limit is 10/minute and you will otherwise see 429s and unvalidated
      # candidates. Check with: scanner.py --check
      # LOOKUP_INTERVAL: "6"
      #
      # Seconds a definitive QRZ answer (200 or 404) is cached before it is
      # eligible to be looked up again (default 86400 = 24h). Rate-limit
      # refusals, transport errors and 5xx responses are never cached, since
      # those aren't evidence about the callsign. Every QRZ lookup — cache
      # hit, prefiltered, or a real outbound fetch — is logged to stdout,
      # so `docker logs` shows exactly what's driving lookup volume.
      # LOOKUP_CACHE_TTL: "86400"
      #
      # PROGRESS_INTERVAL: "60"
      #
      # Stick to one exact frequency instead of hopping. With PARALLEL > 1,
      # only one worker locks to this frequency — the rest keep hopping.
      # LOCK_FREQ: "7200000"
      # LOCK_MODE: "lsb"
      #
      # Whisper recognition tuning
      # PROMPT: ""
      # ASR_LANGUAGE: "en"
      # STOCK_WHISPER: "1"   # only needed on an UberSDR older than 0.1.59 that
      #                      # also lacks whisper.allow_client_params — as the
      #                      # trusted "voiceskimmer" container these params are
      #                      # accepted whatever allow_client_params says
      #
      # DX cluster spot submission — off by default. Spots are immediately
      # visible to every connected DX cluster client.
      #
      #   SPOT             set to 1 to enable; anything else leaves it off
      #   SPOTTER_CALL     your callsign, required with SPOT
      #   SPOTTER_PASS     your DX cluster spot password, required with SPOT
      #   SPOT_TAG         prefix on the spot comment, so these are
      #                    distinguishable from manual or CW-skimmer spots
      #   SPOT_COOLDOWN    SECONDS before the same callsign may be spotted
      #                    again on the same frequency. 900 = 15 minutes
      # SPOT: "1"
      # SPOTTER_CALL: ""
      # SPOTTER_PASS: ""
      # SPOT_TAG: "[Voice]"
      # SPOT_COOLDOWN: "900"
      # Hz tolerance for treating two hearings as the same station. Applies
      # to both the corroboration count (SPOT_MIN_HITS) and the re-spot
      # cooldown. Too tight and one station splits into several, so the hit
      # tally never accumulates.
      # SPOT_FREQ_TOLERANCE: "500"
      # Minimum callsign length to be looked up at all. Anything shorter is
      # dropped before QRZ, so it is never confirmed, logged as valid, or
      # spotted. Applies however the callsign was recovered, including one
      # Whisper wrote out verbatim.
      # MIN_CALLSIGN_LENGTH: "4"
      #
      # Decodes of the same callsign on the same frequency required before a
      # spot goes out (default 2). Above 1 trades latency for confidence — a
      # wrong callsign assembled from one garbled pass is unlikely to be
      # assembled identically a second time on the same frequency.
      # SPOT_MIN_HITS: "2"
      #
      # Dashboard port (0 disables it)
      # WEB_PORT: "6098"
      #
      # JSONL detection log path inside the container (persisted via the
      # /data bind mount below)
      # OUTPUT: "/data/detections.jsonl"
      #
      # VERBOSE: "1"
    networks:
      - sdr-network
    volumes:
      - ./voiceskimmer_data:/data
    logging:
      driver: "fluentd"
      options:
        fluentd-address: "127.0.0.1:24224"
        fluentd-async: "true"
        tag: "voiceskimmer"

networks:
  sdr-network:
    external: true
    name: ubersdr_sdr-network
