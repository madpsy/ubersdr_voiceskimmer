<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UberSDR Voice Skimmer</title>
<base href="__BASE_PATH__/">
<link rel="icon" href="data:,">
<style>
  :root {
    --bg: #0d1117;
    --panel: #161b22;
    --border: #30363d;
    --text: #c9d1d9;
    --dim: #8b949e;
    --accent: #58a6ff;
    --good: #3fb950;
    --warn: #d29922;
    --bad: #f85149;
    --star: #e3b341;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.4 -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  header {
    padding: 10px 16px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 20px;
    flex-wrap: wrap;
    background: var(--panel);
  }
  header h1 {
    font-size: 15px;
    margin: 0;
    color: var(--accent);
    white-space: nowrap;
  }
  #current {
    font-size: 14px;
    color: var(--text);
  }
  #current .empty { color: var(--dim); }
  #current .freq { color: var(--accent); font-weight: 600; }
  #current .dx { color: var(--star); }
  #uptime { margin-left: auto; color: var(--dim); font-size: 12px; white-space: nowrap; }

  #receiver {
    font-size: 12px;
    color: var(--dim);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  #receiver .call { color: var(--text); font-weight: 600; }
  #receiver .sep { color: var(--border); margin: 0 6px; }

  .tp-signal {
    font-size: 12px;
    color: var(--dim);
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }
  .tp-signal .val { color: var(--text); font-weight: 600; }
  .tp-signal .bar {
    display: inline-block;
    width: 70px; height: 6px;
    background: #21262d;
    border-radius: 3px;
    overflow: hidden;
    vertical-align: middle;
    margin: 0 4px;
  }
  .tp-signal .bar i {
    display: block; height: 100%;
    background: var(--dim);
    transition: width .15s linear, background-color .15s linear;
  }
  /* Live reading below the threshold — nothing worth stopping for yet. */
  .tp-signal.low .val, .tp-signal.low .peak { color: var(--warn); }
  .tp-signal.low .bar i { background: var(--warn); }
  /* At or above it — a real signal is present right now. */
  .tp-signal.active .val { color: var(--good); }
  .tp-signal.active .bar i { background: var(--good); }
  /* The peak is what the dwell decision is made on, so it stays green once
     cleared even while the instantaneous value dips between overs. */
  .tp-signal .peak.cleared { color: var(--good); }

  .tp-listen {
    background: #21262d;
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 5px;
    padding: 5px 12px;
    font-size: 13px;
    cursor: pointer;
    white-space: nowrap;
  }
  .tp-listen:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  .tp-listen.on { background: #113a1e; border-color: var(--good); color: var(--good); }
  .tp-listen:disabled { opacity: .45; cursor: not-allowed; }

  #stats {
    display: flex;
    gap: 18px;
    padding: 8px 16px;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
    font-size: 12px;
    color: var(--dim);
    flex-wrap: wrap;
  }
  #stats b { color: var(--text); }

  main {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    padding: 12px;
  }
  @media (max-width: 900px) {
    main { grid-template-columns: 1fr; }
  }
  section.panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 6px;
    display: flex;
    flex-direction: column;
    min-height: 0;
  }
  section.panel h2 {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: .04em;
    color: var(--dim);
    margin: 0;
    padding: 8px 12px;
    border-bottom: 1px solid var(--border);
  }
  .scroll {
    overflow-y: auto;
    max-height: 42vh;
  }
  /* Show a fixed number of transcript lines, then scroll. Height is derived
     from the line metrics rather than a vh fraction, so the visible count is
     the same on any screen instead of drifting with the window. A wrapped
     entry naturally occupies more than one of these lines. */
  /* Declared on the panel so both the scrolling container and the transcript
     inherit them — custom properties inherit downwards only. */
  .transcript-panel {
    --line-size: 12.5px;
    --line-height: 1.5;
    --visible-lines: 5;
    --pad-y: 8px;
  }
  .transcript {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: var(--line-size);
    line-height: var(--line-height);
    padding: var(--pad-y) 12px;
  }
  .transcript-panel .scroll {
    max-height: calc(
      var(--visible-lines) * var(--line-size) * var(--line-height)
      + 2 * var(--pad-y)
    );
  }
  .transcript div { white-space: pre-wrap; word-break: break-word; }
  .transcript .partial { color: var(--dim); }
  .transcript .final { color: var(--text); }
  .transcript .final .marker { color: var(--good); }
  .transcript .meta { color: var(--dim); }

  table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  thead th {
    position: sticky; top: 0;
    text-align: left;
    color: var(--dim);
    font-weight: 500;
    padding: 6px 10px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }
  tbody td {
    padding: 5px 10px;
    border-bottom: 1px solid #21262d;
    white-space: nowrap;
  }
  tbody tr:hover { background: #1c2128; }
  .call { font-weight: 600; }
  .star { color: var(--star); }
  .name { color: var(--dim); }
  .badge {
    display: inline-block;
    padding: 1px 6px;
    border-radius: 3px;
    font-size: 11px;
  }
  .badge.spotted { background: #113a1e; color: var(--good); }
  .badge.cooldown { background: #3a2f10; color: var(--warn); }
  .badge.no { background: #21262d; color: var(--dim); }
  .empty-row td { color: var(--dim); font-style: italic; }

  #spots-panel .scroll, #targets-panel .scroll { max-height: 32vh; }

  /* Transcript panels span the full grid width and split between themselves,
     so one worker gets the whole row and two sit side by side. */
  /* Stacked, not side by side: transcript lines are long, so full width
     matters more than seeing both at once. */
  #transcripts {
    grid-column: 1 / -1;
    display: grid;
    grid-template-columns: 1fr;
    gap: 12px;
  }
  .tp-head {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }
  .tp-head .tp-label { flex: 0 0 auto; }
  .tp-dot {
    display: inline-block;
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--dim);
    margin-right: 6px;
    vertical-align: middle;
    flex: 0 0 auto;
  }
  .tp-dot.up { background: var(--good); box-shadow: 0 0 5px var(--good); }
  .tp-dot.down { background: var(--bad); box-shadow: 0 0 5px var(--bad); }
  .tp-head .tp-current {
    color: var(--text);
    text-transform: none;
    letter-spacing: 0;
    font-size: 12px;
  }
  .tp-head .tp-current .freq { color: var(--accent); font-weight: 600; }
  .tp-head .tp-current .dx { color: var(--star); }
  .tp-head .tp-current .empty { color: var(--dim); }
  .tp-head .tp-signal { margin-left: auto; }
</style>
</head>
<body>

<header>
  <h1>Voice Skimmer</h1>
  <div id="receiver"></div>
  <div id="uptime"></div>
</header>

<div id="stats"></div>

<main>
  <!-- One transcript panel per scanning worker, built by app.js from the
       workers array. Each carries its own frequency, SNR and Listen button,
       since each is an independent session on its own frequency. -->
  <div id="transcripts"></div>

  <section class="panel">
    <h2>Confirmed callsigns</h2>
    <div class="scroll">
      <table id="confirmed-table">
        <thead><tr>
          <th>Call</th><th>Band</th><th>Freq</th><th>Mode</th><th>Name</th><th>Country</th>
          <th>First</th><th>Last</th><th>Hits</th><th>Spotted</th>
        </tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </section>

  <section class="panel" id="spots-panel">
    <h2>Recent DX spots submitted</h2>
    <div class="scroll">
      <table id="spots-table">
        <thead><tr><th>Time</th><th>Call</th><th>Freq</th><th>Comment</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </section>

  <section class="panel" id="targets-panel">
    <h2>Band / frequency activity</h2>
    <div class="scroll">
      <table id="targets-table">
        <thead><tr>
          <th>Band</th><th>Freq</th><th>Mode</th><th>SNR</th><th>Conf</th>
          <th>DX spot</th><th>Visits</th><th>Found</th>
        </tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </section>
</main>

<script src="static/app.js"></script>
</body>
</html>
