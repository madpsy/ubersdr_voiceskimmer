<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UberSDR Voice Skimmer</title>
<base href="__BASE_PATH__/">
<link rel="icon" href="data:,">
<style>
  :root {
    --bg: #0d1117;
    --panel: #161b22;
    --border: #30363d;
    --text: #c9d1d9;
    --dim: #8b949e;
    --accent: #58a6ff;
    --good: #3fb950;
    --warn: #d29922;
    --bad: #f85149;
    --star: #e3b341;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.4 -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  header {
    padding: 10px 16px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 20px;
    flex-wrap: wrap;
    background: var(--panel);
  }
  header h1 {
    font-size: 15px;
    margin: 0;
    color: var(--accent);
    white-space: nowrap;
  }
  #current {
    font-size: 14px;
    color: var(--text);
  }
  #current .empty { color: var(--dim); }
  #current .freq { color: var(--accent); font-weight: 600; }
  #current .dx { color: var(--star); }
  #uptime { margin-left: auto; color: var(--dim); font-size: 12px; white-space: nowrap; }

  #listen {
    background: #21262d;
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 5px;
    padding: 5px 12px;
    font-size: 13px;
    cursor: pointer;
    white-space: nowrap;
  }
  #listen:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  #listen.on { background: #113a1e; border-color: var(--good); color: var(--good); }
  #listen:disabled { opacity: .45; cursor: not-allowed; }

  #stats {
    display: flex;
    gap: 18px;
    padding: 8px 16px;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
    font-size: 12px;
    color: var(--dim);
    flex-wrap: wrap;
  }
  #stats b { color: var(--text); }

  main {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    padding: 12px;
  }
  @media (max-width: 900px) {
    main { grid-template-columns: 1fr; }
  }
  section.panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 6px;
    display: flex;
    flex-direction: column;
    min-height: 0;
  }
  section.panel h2 {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: .04em;
    color: var(--dim);
    margin: 0;
    padding: 8px 12px;
    border-bottom: 1px solid var(--border);
  }
  .scroll {
    overflow-y: auto;
    max-height: 42vh;
  }
  #transcript-panel .scroll { max-height: 60vh; }

  #transcript {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 12.5px;
    padding: 8px 12px;
  }
  #transcript div { padding: 1px 0; white-space: pre-wrap; word-break: break-word; }
  #transcript .partial { color: var(--dim); }
  #transcript .final { color: var(--text); }
  #transcript .final .marker { color: var(--good); }
  #transcript .meta { color: var(--dim); }

  table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  thead th {
    position: sticky; top: 0;
    text-align: left;
    color: var(--dim);
    font-weight: 500;
    padding: 6px 10px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }
  tbody td {
    padding: 5px 10px;
    border-bottom: 1px solid #21262d;
    white-space: nowrap;
  }
  tbody tr:hover { background: #1c2128; }
  .call { font-weight: 600; }
  .star { color: var(--star); }
  .name { color: var(--dim); }
  .badge {
    display: inline-block;
    padding: 1px 6px;
    border-radius: 3px;
    font-size: 11px;
  }
  .badge.spotted { background: #113a1e; color: var(--good); }
  .badge.cooldown { background: #3a2f10; color: var(--warn); }
  .badge.no { background: #21262d; color: var(--dim); }
  .empty-row td { color: var(--dim); font-style: italic; }

  #spots-panel .scroll, #targets-panel .scroll { max-height: 32vh; }
</style>
</head>
<body>

<header>
  <h1>📻 Voice Skimmer</h1>
  <div id="current"><span class="empty">waiting for a target…</span></div>
  <button id="listen" disabled title="Hear what the scanner is tuned to — follows it as it hops">🔈 Listen</button>
  <div id="uptime"></div>
</header>
<audio id="audio-el" hidden></audio>

<div id="stats"></div>

<main>
  <section class="panel" id="transcript-panel">
    <h2>Live transcript</h2>
    <div class="scroll" id="transcript-scroll"><div id="transcript"></div></div>
  </section>

  <section class="panel">
    <h2>Confirmed callsigns</h2>
    <div class="scroll">
      <table id="confirmed-table">
        <thead><tr>
          <th>Call</th><th>Band</th><th>Freq</th><th>Mode</th><th>Name</th><th>Country</th>
          <th>First</th><th>Last</th><th>Hits</th><th>Spotted</th>
        </tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </section>

  <section class="panel" id="spots-panel">
    <h2>Recent DX spots submitted</h2>
    <div class="scroll">
      <table id="spots-table">
        <thead><tr><th>Time</th><th>Call</th><th>Freq</th><th>Comment</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </section>

  <section class="panel" id="targets-panel">
    <h2>Band / frequency activity</h2>
    <div class="scroll">
      <table id="targets-table">
        <thead><tr>
          <th>Band</th><th>Freq</th><th>Mode</th><th>SNR</th><th>Conf</th>
          <th>DX spot</th><th>Visits</th><th>Found</th>
        </tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </section>
</main>

<script src="static/app.js"></script>
</body>
</html>
